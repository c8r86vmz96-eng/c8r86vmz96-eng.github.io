<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Survey Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      boxShadow: { soft: '0 18px 45px rgba(15, 23, 42, .12)', button: '0 10px 0 rgba(15, 23, 42, .12), 0 18px 32px rgba(15, 23, 42, .16)' }
    }}}
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { min-height: 100svh; overscroll-behavior: none; }
    button { touch-action: manipulation; }
    .pressable { transition: transform .1s ease, filter .1s ease; }
    .pressable:active { transform: translateY(7px) scale(.985); filter: brightness(.96); }
    .modal-backdrop { animation: fadeIn .16s ease-out; }
    .modal-card { animation: slideUp .18s ease-out; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: translateY(0) } }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <main class="mx-auto flex min-h-[100svh] w-full max-w-3xl flex-col bg-slate-50 px-4 py-5 sm:px-6 sm:py-7">
    <header class="mb-7 flex items-center justify-between">
      <div>
        <p class="text-xs font-bold uppercase tracking-[.22em] text-slate-400">Survey counter</p>
        <h1 id="pageTitle" class="mt-1 text-2xl font-black tracking-tight text-slate-900">Choose survey location</h1>
      </div>
      <button id="homeButton" aria-label="Back to survey selection" class="hidden pressable grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-700 shadow-soft ring-1 ring-slate-200">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </header>

    <section id="selectionView" class="flex flex-1 flex-col">
      <div class="mb-5 rounded-3xl bg-white p-5 shadow-soft ring-1 ring-slate-200">
        <h2 class="text-center text-xl font-black text-slate-900">From where will you be conducting the survey?</h2>
      </div>
      <div class="grid flex-1 content-start gap-4">
        <button data-survey="entrance" class="pressable flex min-h-28 items-center justify-between rounded-3xl bg-blue-600 px-6 text-left text-white shadow-button">
          <span><span class="block text-2xl font-black">Entrance</span><span class="mt-1 block text-sm font-semibold text-blue-100">Two directions</span></span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button data-survey="otw" class="pressable flex min-h-28 items-center justify-between rounded-3xl bg-violet-600 px-6 text-left text-white shadow-button">
          <span><span class="block text-2xl font-black">OTW (Accenten)</span><span class="mt-1 block text-sm font-semibold text-violet-100">Three directions</span></span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button data-survey="living" class="pressable flex min-h-28 items-center justify-between rounded-3xl bg-emerald-600 px-6 text-left text-white shadow-button">
          <span><span class="block text-2xl font-black">Showroom (Living Room)</span><span class="mt-1 block text-sm font-semibold text-emerald-100">Two directions</span></span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <section id="counterView" class="hidden flex flex-1 flex-col">
      <div class="mb-5 rounded-3xl bg-white p-5 shadow-soft ring-1 ring-slate-200">
        <div class="flex items-center justify-between">
          <div><p class="text-sm font-semibold text-slate-500">Current survey</p><p class="mt-1 text-3xl font-black tabular-nums" id="totalCount">0</p></div>
          <div class="rounded-2xl bg-slate-100 px-3 py-2 text-right"><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Total entries</p><p class="mt-0.5 text-sm font-bold text-slate-700">Tap a button below</p></div>
        </div>
      </div>
      <div id="counterButtons" class="grid flex-1 grid-cols-2 gap-3 sm:gap-5"></div>
      <p class="mt-5 text-center text-xs font-medium text-slate-400">Counts are saved on this device.</p>
    </section>
  </main>

  <div id="menuModal" class="modal-backdrop fixed inset-0 z-20 hidden bg-slate-950/45 p-4 backdrop-blur-sm" role="dialog" aria-modal="true">
    <div class="modal-card mx-auto mt-auto max-w-2xl rounded-[2rem] bg-white p-5 shadow-2xl sm:mt-10 sm:p-7">
      <div class="mb-6 flex items-start justify-between"><div><p class="text-xs font-bold uppercase tracking-[.2em] text-slate-400">Menu</p><h2 class="mt-1 text-2xl font-black">Dashboard</h2></div><button id="closeMenu" class="grid h-10 w-10 place-items-center rounded-xl bg-slate-100 text-slate-600" aria-label="Close menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p id="dashboardSurveyName" class="mb-4 text-sm font-bold text-slate-500"></p>
      <div id="dashboardCards" class="grid gap-3"></div>
      <div class="my-6 h-px bg-slate-200"></div>
      <button id="resetButton" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-red-200 bg-red-50 px-4 py-4 font-bold text-red-700 active:bg-red-100"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>Reset survey</button>
    </div>
  </div>

  <div id="confirmModal" class="modal-backdrop fixed inset-0 z-30 hidden bg-slate-950/55 p-4 backdrop-blur-sm" role="dialog" aria-modal="true">
    <div class="modal-card mx-auto mt-[22vh] max-w-sm rounded-3xl bg-white p-6 shadow-2xl">
      <div class="grid h-12 w-12 place-items-center rounded-2xl bg-red-100 text-red-600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.8 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/></svg></div>
      <h2 class="mt-5 text-xl font-black">Are you sure you want to reset?</h2>
      <p class="mt-2 text-sm leading-relaxed text-slate-500">Choose whether to clear only the current survey or every survey.</p>
      <div class="mt-6 grid gap-3"><button id="currentResetButton" class="rounded-2xl bg-red-500 px-4 py-3.5 text-sm font-bold text-white active:bg-red-600">delete only this survey</button><button id="allResetButton" class="rounded-2xl bg-red-700 px-4 py-3.5 text-sm font-bold text-white active:bg-red-800">delete all surveys</button><button id="cancelButton" class="rounded-2xl bg-slate-100 px-4 py-3.5 font-bold text-slate-700 active:bg-slate-200">cancel</button></div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'multi-survey-counter-v1';
const surveyDefinitions = {
  entrance: { title: 'Entrance', color: 'blue', items: [
    { key: 'up', label: 'Showroom (Upstairs)', icon: 'up', color: 'orange' },
    { key: 'right', label: 'Markethall (Downstairs)', icon: 'right', color: 'green' }
  ]},
  otw: { title: 'OTW (Accenten)', color: 'violet', items: [
    { key: 'left', label: 'TS/SS', icon: 'left', color: 'orange' },
    { key: 'up', label: 'Textiles (Shortcut)', icon: 'up', color: 'yellow' },
    { key: 'right', label: 'Cook Shop (Shortcut)', icon: 'right', color: 'green' }
  ]},
  living: { title: 'Showroom (Living Room)', color: 'emerald', items: [
    { key: 'up', label: 'Living Room Storage', icon: 'up', color: 'green' },
    { key: 'right', label: 'PAX (Shortcut)', icon: 'right', color: 'orange' }
  ]}
};
let data = { entrance: {up:0,right:0}, otw: {left:0,up:0,right:0}, living: {up:0,right:0} };
let currentSurvey = null;
try { data = { ...data, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') }; } catch (_) {}
const $ = id => document.getElementById(id);
const icon = type => ({
  up: '<svg class="h-12 w-12 sm:h-14 sm:w-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  right: '<svg class="h-12 w-12 sm:h-14 sm:w-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  left: '<svg class="h-12 w-12 sm:h-14 sm:w-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>'
}[type]);
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function colorClasses(color) { return ({
  orange: ['bg-orange-500','ring-orange-600/20','text-orange-100'],
  green: ['bg-emerald-600','ring-emerald-700/20','text-emerald-100'],
  yellow: ['bg-amber-400','ring-amber-500/20','text-amber-950']
})[color]; }
function renderCounters() {
  const def = surveyDefinitions[currentSurvey], counts = data[currentSurvey] || {};
  const total = def.items.reduce((sum, item) => sum + Number(counts[item.key] || 0), 0);
  $('totalCount').textContent = total;
  $('pageTitle').textContent = def.title;
  $('counterButtons').className = 'grid flex-1 gap-3 sm:gap-5 ' + (def.items.length === 3 ? 'grid-cols-3' : 'grid-cols-2');
  $('counterButtons').innerHTML = def.items.map(item => {
    const [bg, ring, muted] = colorClasses(item.color), count = Number(counts[item.key] || 0), share = total ? (count / total * 100).toFixed(1) : '0.0';
    const textTone = item.color === 'yellow' ? 'text-amber-950' : 'text-white';
    return `<button data-count-key="${item.key}" class="pressable flex min-h-[45vh] flex-col items-center justify-center rounded-[2rem] ${bg} ${textTone} shadow-button ring-1 ${ring} px-2 sm:px-3"><span class="grid h-20 w-20 place-items-center rounded-3xl bg-white/15 sm:h-24 sm:w-24">${icon(item.icon)}</span><span class="mt-7 text-4xl font-black tabular-nums sm:text-6xl">${count}</span><span class="mt-3 max-w-full text-center text-base font-extrabold leading-snug sm:text-lg">${item.label}</span><span class="mt-2 text-sm font-extrabold tabular-nums ${muted}">${share}% share</span></button>`;
  }).join('');
  $('counterButtons').querySelectorAll('[data-count-key]').forEach(btn => btn.addEventListener('click', () => { const key = btn.dataset.countKey; data[currentSurvey][key] = Number(data[currentSurvey][key] || 0) + 1; save(); renderCounters(); }));
}
function renderDashboard() {
  const def = surveyDefinitions[currentSurvey], counts = data[currentSurvey] || {}, total = def.items.reduce((sum, item) => sum + Number(counts[item.key] || 0), 0);
  $('dashboardSurveyName').textContent = def.title;
  $('dashboardCards').className = 'grid gap-3 ' + (def.items.length === 3 ? 'grid-cols-3' : 'grid-cols-2');
  const palette = {orange:['border-orange-100','bg-orange-50','text-orange-950','text-orange-700','text-orange-600'],green:['border-emerald-100','bg-emerald-50','text-emerald-950','text-emerald-700','text-emerald-600'],yellow:['border-amber-200','bg-amber-50','text-amber-950','text-amber-700','text-amber-700']};
  $('dashboardCards').innerHTML = def.items.map(item => { const count = Number(counts[item.key] || 0), share = total ? (count / total * 100).toFixed(1) : '0.0', card = palette[item.color]; return `<div class="rounded-2xl border ${card[0]} ${card[1]} p-3 sm:p-4"><div class="mb-4 grid h-10 w-10 place-items-center rounded-xl bg-slate-900 text-white">${icon(item.icon).replace('h-12 w-12 sm:h-14 sm:w-14','h-5 w-5')}</div><p class="text-sm font-bold leading-snug ${card[2]}">${item.label}</p><p class="mt-3 text-3xl font-black tabular-nums ${card[3]}">${count}</p><p class="mt-1 text-xs font-semibold ${card[4]}">entries</p><p class="mt-2 text-sm font-extrabold tabular-nums ${card[4]}">${share}% share</p></div>`; }).join('');
}
function open(el) { el.classList.remove('hidden'); document.body.classList.add('overflow-hidden'); }
function close(el) { el.classList.add('hidden'); if ($('menuModal').classList.contains('hidden') && $('confirmModal').classList.contains('hidden')) document.body.classList.remove('overflow-hidden'); }
function showSurvey(key) { currentSurvey = key; $('selectionView').classList.add('hidden'); $('counterView').classList.remove('hidden'); $('homeButton').classList.remove('hidden'); renderCounters(); }
function showHome() { close($('menuModal')); close($('confirmModal')); currentSurvey = null; $('selectionView').classList.remove('hidden'); $('counterView').classList.add('hidden'); $('homeButton').classList.add('hidden'); $('pageTitle').textContent = 'Choose survey location'; }
document.querySelectorAll('[data-survey]').forEach(btn => btn.addEventListener('click', () => showSurvey(btn.dataset.survey)));
$('homeButton').addEventListener('click', showHome);
// The menu button is created below for counter pages.
$('closeMenu').addEventListener('click', () => close($('menuModal')));
$('resetButton').addEventListener('click', () => open($('confirmModal')));
$('cancelButton').addEventListener('click', () => close($('confirmModal')));
$('currentResetButton').addEventListener('click', () => { data[currentSurvey] = Object.fromEntries(surveyDefinitions[currentSurvey].items.map(item => [item.key, 0])); save(); renderCounters(); close($('confirmModal')); close($('menuModal')); });
$('allResetButton').addEventListener('click', () => { Object.keys(surveyDefinitions).forEach(key => { data[key] = Object.fromEntries(surveyDefinitions[key].items.map(item => [item.key, 0])); }); save(); renderCounters(); close($('confirmModal')); close($('menuModal')); });
$('menuModal').addEventListener('click', e => { if (e.target === $('menuModal')) close($('menuModal')); });
$('confirmModal').addEventListener('click', e => { if (e.target === $('confirmModal')) close($('confirmModal')); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { close($('confirmModal')); close($('menuModal')); } });
// Add the menu button only when a counter page is active, preserving the simple opening screen.
const menuButton = document.createElement('button'); menuButton.id = 'menuButton'; menuButton.setAttribute('aria-label','Open menu'); menuButton.className = 'hidden pressable grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-700 shadow-soft ring-1 ring-slate-200'; menuButton.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'; document.querySelector('header').appendChild(menuButton);
menuButton.addEventListener('click', () => { renderDashboard(); open($('menuModal')); });
const originalShowSurvey = showSurvey;
showSurvey = key => { originalShowSurvey(key); menuButton.classList.remove('hidden'); };
const originalShowHome = showHome;
showHome = () => { originalShowHome(); menuButton.classList.add('hidden'); };
</script>
</body>
</html>
